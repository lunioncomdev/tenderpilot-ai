server {
  listen 80;
  server_name _;

  client_max_body_size 60m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Résolution DNS dynamique : le conteneur « web » peut changer d'IP lors d'un redéploiement.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web_upstream http://web:3000;

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    # $http_host conserve le port : Next.js compare l'hôte transmis à l'en-tête Origin (protection CSRF).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
}
